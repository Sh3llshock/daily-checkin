<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Daily Check-in</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0e0e0f;
    --bg2: #1a1a1c;
    --bg3: #242426;
    --border: rgba(255,255,255,0.08);
    --border2: rgba(255,255,255,0.14);
    --text: #f0ede8;
    --muted: #888784;
    --accent: #c8b89a;
    --accent-dim: rgba(200,184,154,0.12);
    --danger: #e24b4a;
    --success: #1D9E75;
    --radius: 14px;
    --radius-sm: 8px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding: 0;
    overscroll-behavior: none;
  }

  /* ── SCREENS ── */
  .screen { display: none; flex-direction: column; min-height: 100vh; }
  .screen.active { display: flex; }

  /* ── SETUP SCREEN ── */
  #setup {
    padding: 56px 24px 40px;
    justify-content: center;
    gap: 0;
  }

  .setup-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .setup-title {
    font-size: 28px;
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: 8px;
  }

  .setup-sub {
    font-size: 15px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 40px;
  }

  .field-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  textarea {
    width: 100%;
    background: var(--bg2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: inherit;
    font-size: 16px;
    line-height: 1.5;
    padding: 14px 16px;
    resize: none;
    outline: none;
    -webkit-appearance: none;
    transition: border-color 0.15s;
  }

  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: var(--muted); }

  .char-count {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
    margin-top: 6px;
    margin-bottom: 28px;
  }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: #0e0e0f;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    padding: 16px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-appearance: none;
  }

  .btn-primary:active { opacity: 0.85; transform: scale(0.98); }
  .btn-primary:disabled { opacity: 0.35; cursor: default; transform: none; }

  /* ── MAIN CHECK-IN SCREEN ── */
  #main { padding: 0 0 40px; }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 20px 0;
  }

  .date-pill {
    font-size: 12px;
    color: var(--muted);
    background: var(--bg2);
    border: 0.5px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
  }

  .settings-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 6px;
    font-size: 20px;
    line-height: 1;
    transition: color 0.15s;
  }

  .settings-btn:active { color: var(--text); }

  /* goal block */
  .goal-block {
    margin: 24px 20px 0;
    background: var(--accent-dim);
    border: 0.5px solid rgba(200,184,154,0.2);
    border-radius: var(--radius);
    padding: 20px;
  }

  .goal-eyebrow {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 10px;
  }

  .goal-text {
    font-size: 20px;
    font-weight: 600;
    line-height: 1.3;
    color: var(--text);
  }

  /* streak */
  .streak-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 16px 20px 0;
  }

  .streak-num {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
  }

  .streak-label { font-size: 13px; color: var(--muted); }

  .dots-row {
    display: flex;
    gap: 5px;
    padding: 10px 20px 0;
    flex-wrap: wrap;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--bg3);
    border: 0.5px solid var(--border2);
    transition: background 0.2s;
  }

  .dot.filled { background: var(--accent); border-color: var(--accent); }
  .dot.today { background: var(--success); border-color: var(--success); }

  /* divider */
  .divider {
    height: 0.5px;
    background: var(--border);
    margin: 20px 0;
  }

  /* log entry area */
  .log-section { padding: 0 20px; }

  .log-question {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .log-hint {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .log-textarea {
    min-height: 100px;
    margin-bottom: 6px;
  }

  .submit-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
  }

  .btn-submit {
    flex: 1;
    background: var(--accent);
    color: #0e0e0f;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 14px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-appearance: none;
  }

  .btn-submit:active { opacity: 0.85; transform: scale(0.98); }
  .btn-submit:disabled { opacity: 0.35; cursor: default; transform: none; }

  /* already logged state */
  .logged-block {
    background: var(--bg2);
    border: 0.5px solid var(--border2);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 0;
  }

  .logged-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--success);
    margin-bottom: 10px;
  }

  .logged-tag::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--success);
  }

  .logged-entry {
    font-size: 15px;
    color: var(--text);
    line-height: 1.6;
  }

  .btn-edit {
    margin-top: 14px;
    background: none;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 16px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
    -webkit-appearance: none;
  }

  .btn-edit:active { color: var(--text); border-color: var(--border2); }

  .btn-early {
    background: none;
    border: 0.5px solid var(--accent);
    border-radius: var(--radius-sm);
    color: var(--accent);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 16px;
    cursor: pointer;
    transition: opacity 0.15s;
    -webkit-appearance: none;
  }
  .btn-early:active { opacity: 0.7; }

  /* history section */
  .history-section { padding: 0 20px; }

  .section-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .history-item {
    border-left: 1.5px solid var(--border2);
    padding: 0 0 20px 16px;
    position: relative;
  }

  .history-item:last-child { padding-bottom: 0; }

  .history-item::before {
    content: '';
    position: absolute;
    left: -4.5px;
    top: 5px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--bg3);
    border: 1.5px solid var(--border2);
  }

  .history-date {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 5px;
  }

  .history-entry {
    font-size: 14px;
    color: var(--text);
    line-height: 1.55;
  }

  .empty-history {
    font-size: 14px;
    color: var(--muted);
    font-style: italic;
  }

  /* settings overlay */
  #settings-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: flex-end;
  }

  #settings-overlay.open { display: flex; }

  .settings-sheet {
    width: 100%;
    background: var(--bg2);
    border-radius: 20px 20px 0 0;
    padding: 24px 24px 48px;
    border-top: 0.5px solid var(--border2);
  }

  .sheet-handle {
    width: 36px; height: 4px;
    border-radius: 2px;
    background: var(--border2);
    margin: 0 auto 24px;
  }

  .sheet-title {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 20px;
  }

  .sheet-field-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .settings-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  .btn-save {
    flex: 1;
    background: var(--accent);
    color: #0e0e0f;
    border: none;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 14px;
    cursor: pointer;
    -webkit-appearance: none;
  }

  .btn-cancel {
    background: none;
    border: 0.5px solid var(--border2);
    border-radius: var(--radius-sm);
    color: var(--muted);
    font-family: inherit;
    font-size: 15px;
    padding: 14px 20px;
    cursor: pointer;
    -webkit-appearance: none;
  }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div class="screen" id="setup">
  <p class="setup-label">Morning check-in</p>
  <h1 class="setup-title">What's your goal this week?</h1>
  <p class="setup-sub">One clear goal. You'll see it every morning before you can log your day.</p>

  <p class="field-label">Weekly goal</p>
  <textarea id="setup-goal" class="log-textarea" rows="3" maxlength="200" placeholder="e.g. Close first paying client for MaaSec" oninput="updateSetupChar()"></textarea>
  <p class="char-count"><span id="setup-char">0</span>/200</p>

  <button class="btn-primary" id="setup-btn" onclick="saveGoal()" disabled>Start checking in</button>
</div>

<!-- MAIN SCREEN -->
<div class="screen" id="main">
  <div class="top-bar">
    <span class="date-pill" id="date-display"></span>
    <button class="settings-btn" onclick="openSettings()" aria-label="Change goal">⚙</button>
  </div>

  <!-- goal -->
  <div class="goal-block">
    <p class="goal-eyebrow">This week's goal</p>
    <p class="goal-text" id="goal-display"></p>
  </div>

  <!-- streak -->
  <div class="streak-row">
    <span class="streak-num" id="streak-num">0</span>
    <span class="streak-label">day streak</span>
  </div>
  <div class="dots-row" id="dots-row"></div>

  <div class="divider"></div>

  <!-- log -->
  <div class="log-section">
    <p class="log-question">How did yesterday go?</p>
    <p class="log-hint" id="log-hint"></p>
    <div id="log-input-area">
      <textarea class="log-textarea" id="log-input" rows="4" maxlength="400" placeholder="A sentence or two is enough..."></textarea>
      <p class="char-count"><span id="log-char">0</span>/400</p>
      <div class="submit-row">
        <button class="btn-submit" id="log-btn" onclick="submitLog()" disabled>Log it</button>
      </div>
    </div>
    <div id="logged-area" style="display:none">
      <div class="logged-block">
        <p class="logged-tag">Logged today</p>
        <p class="logged-entry" id="logged-entry-text"></p>
      </div>
      <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;">
        <button class="btn-edit" onclick="editLog()">Edit entry</button>
        <button class="btn-early" onclick="openSettings()">Finished early? Set next goal →</button>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- history -->
  <div class="history-section">
    <p class="section-label">Recent entries</p>
    <div id="history-list"></div>
  </div>
</div>

<!-- SETTINGS OVERLAY -->
<div id="settings-overlay" onclick="closeSettingsOutside(event)">
  <div class="settings-sheet">
    <div class="sheet-handle"></div>
    <p class="sheet-title">Update goal</p>
    <p class="sheet-field-label">Weekly goal</p>
    <textarea id="settings-goal" rows="3" maxlength="200" style="width:100%; margin-bottom:6px;" placeholder="Your goal this week..."></textarea>
    <p class="char-count"><span id="settings-char">0</span>/200</p>
    <div class="settings-actions">
      <button class="btn-cancel" onclick="closeSettings()">Cancel</button>
      <button class="btn-save" onclick="saveSettings()">Save</button>
    </div>
  </div>
</div>

<script>
const KEY_GOAL = 'ci_goal';
const KEY_LOGS = 'ci_logs';

function getState() {
  const goal = localStorage.getItem(KEY_GOAL) || '';
  let logs = {};
  try { logs = JSON.parse(localStorage.getItem(KEY_LOGS) || '{}'); } catch(e) {}
  return { goal, logs };
}

function saveState(goal, logs) {
  localStorage.setItem(KEY_GOAL, goal);
  localStorage.setItem(KEY_LOGS, JSON.stringify(logs));
}

function todayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function formatDate(key) {
  const [y,m,d] = key.split('-').map(Number);
  const date = new Date(y, m-1, d);
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${days[date.getDay()]} ${d} ${months[m-1]}`;
}

function todayDisplay() {
  const d = new Date();
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}`;
}

function getStreak(logs) {
  const today = todayKey();
  let streak = 0;
  let d = new Date();
  while(true) {
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (logs[k]) {
      streak++;
      d.setDate(d.getDate() - 1);
    } else {
      if (k === today) {
        d.setDate(d.getDate() - 1);
      } else {
        break;
      }
    }
  }
  return streak;
}

function renderDots(logs) {
  const row = document.getElementById('dots-row');
  row.innerHTML = '';
  const today = todayKey();
  for(let i = 13; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    const k = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dot = document.createElement('div');
    dot.className = 'dot' + (k === today && logs[k] ? ' today' : (logs[k] ? ' filled' : ''));
    row.appendChild(dot);
  }
}

function renderHistory(logs) {
  const list = document.getElementById('history-list');
  const today = todayKey();
  const entries = Object.entries(logs)
    .filter(([k]) => k !== today)
    .sort((a,b) => b[0].localeCompare(a[0]))
    .slice(0, 7);

  if(entries.length === 0) {
    list.innerHTML = '<p class="empty-history">Your past entries will appear here.</p>';
    return;
  }

  list.innerHTML = entries.map(([k, v]) => `
    <div class="history-item">
      <p class="history-date">${formatDate(k)}</p>
      <p class="history-entry">${escHtml(v)}</p>
    </div>
  `).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderMain() {
  const { goal, logs } = getState();
  const today = todayKey();
  const todayLog = logs[today];

  document.getElementById('date-display').textContent = todayDisplay();
  document.getElementById('goal-display').textContent = goal;

  const streak = getStreak(logs);
  document.getElementById('streak-num').textContent = streak;
  renderDots(logs);

  const d = new Date();
  const yest = new Date(d); yest.setDate(d.getDate()-1);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('log-hint').textContent =
    `Toward your goal — what actually happened on ${months[yest.getMonth()]} ${yest.getDate()}?`;

  if(todayLog) {
    document.getElementById('log-input-area').style.display = 'none';
    document.getElementById('logged-area').style.display = 'block';
    document.getElementById('logged-entry-text').textContent = todayLog;
  } else {
    document.getElementById('log-input-area').style.display = 'block';
    document.getElementById('logged-area').style.display = 'none';
  }

  renderHistory(logs);
}

function init() {
  const { goal } = getState();
  if(!goal) {
    show('setup');
  } else {
    show('main');
    renderMain();
  }
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// Setup
function updateSetupChar() {
  const val = document.getElementById('setup-goal').value;
  document.getElementById('setup-char').textContent = val.length;
  document.getElementById('setup-btn').disabled = val.trim().length < 5;
}

function saveGoal() {
  const goal = document.getElementById('setup-goal').value.trim();
  if(!goal) return;
  const { logs } = getState();
  saveState(goal, logs);
  show('main');
  renderMain();
}

// Log
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('log-input');
  if(input) {
    input.addEventListener('input', () => {
      document.getElementById('log-char').textContent = input.value.length;
      document.getElementById('log-btn').disabled = input.value.trim().length < 3;
    });
  }
  init();
});

function submitLog() {
  const val = document.getElementById('log-input').value.trim();
  if(!val) return;
  const { goal, logs } = getState();
  logs[todayKey()] = val;
  saveState(goal, logs);
  renderMain();
}

function editLog() {
  const { logs } = getState();
  const today = todayKey();
  const current = logs[today] || '';
  document.getElementById('log-input').value = current;
  document.getElementById('log-char').textContent = current.length;
  document.getElementById('log-btn').disabled = current.trim().length < 3;
  document.getElementById('logged-area').style.display = 'none';
  document.getElementById('log-input-area').style.display = 'block';
  document.getElementById('log-input').focus();
}

// Settings
function openSettings() {
  const { goal } = getState();
  document.getElementById('settings-goal').value = goal;
  document.getElementById('settings-char').textContent = goal.length;
  document.getElementById('settings-overlay').classList.add('open');
}

document.getElementById('settings-goal').addEventListener('input', function() {
  document.getElementById('settings-char').textContent = this.value.length;
});

function closeSettings() {
  document.getElementById('settings-overlay').classList.remove('open');
}

function closeSettingsOutside(e) {
  if(e.target === document.getElementById('settings-overlay')) closeSettings();
}

function saveSettings() {
  const goal = document.getElementById('settings-goal').value.trim();
  if(!goal) return;
  const { logs } = getState();
  saveState(goal, logs);
  closeSettings();
  renderMain();
}
</script>
</body>
</html>
